# iOS build on GitHub's macOS runners. Produces a simulator build (no Apple account needed) on every
# push to main. Building for real iPhones needs an Apple Developer account and signing secrets.
name: iOS build

# Paused: iOS builds run only when started by hand (Actions → iOS build → Run workflow), to speed up
# iteration. To turn them back on, restore the push (main) and pull_request triggers from git history.
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit

  ios-simulator:
    needs: checks
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install
        env: { CI: 1 }
      - name: Install CocoaPods
        run: cd ios && pod install
      - name: Build for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Still.xcworkspace -scheme Still -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 40
      - name: Package the app
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -qr "$GITHUB_WORKSPACE/Still-simulator.zip" Still.app
      - uses: actions/upload-artifact@v4
        with:
          name: Still-ios-simulator
          path: Still-simulator.zip
          retention-days: 14

      # ---- Test the app on an iPhone simulator, like a person would ----
      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in d if 'iOS' in k), reverse=True)
          print(next(x['udid'] for k in runtimes for x in d[k] if x['name'].startswith('iPhone') and 'Pro' in x['name']))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl list devices | grep Booted
      - name: Install Still
        run: xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Still.app
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run the app tests
        timeout-minutes: 25
        env:
          # The iOS test driver is slow to start on GitHub runners; give it longer before failing.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
        run: |
          set -o pipefail
          mkdir -p ios-results
          # One retry: the simulator driver sometimes fails to attach on the first attempt.
          for attempt in 1 2; do
            if maestro --device "$UDID" test .maestro --format junit --output ios-results/report.xml --test-output-dir ios-results 2>&1 | tee ios-results/maestro.log; then
              break
            fi
            if grep -q "driver not ready\|IOSDriverTimeoutException" ios-results/maestro.log && [ "$attempt" = 1 ]; then
              echo "::warning::iOS driver did not start; retrying once"; sleep 10; continue
            fi
            exit 1
          done
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p ios-results/screens
          find ios-results . -maxdepth 4 -name '0*.png' -not -path './ios-results/screens/*' -exec cp {} ios-results/screens/ \; 2>/dev/null || true
          ls -la ios-results/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Still-ios-test-results
          path: ios-results
          retention-days: 14
      - name: Publish results to the ios-test-results branch
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: |
          cd ios-results
          git init -q && git checkout -q -b ios-test-results
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "iOS test results for ${{ github.sha }} (run ${{ github.run_id }})" > README.md
          # GitHub refuses files over 100 MB; simulator logs can exceed that. They stay in the run's artifact.
          find . -type f -size +45M -print -delete
          git add -A && git commit -qm "iOS test results for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-test-results
