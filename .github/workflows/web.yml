name: Web app

# Builds the web version of Still on every change; publishes it to the Azure Storage static
# website on main. Same keyless GitHub sign-in to Azure as the review server deploy.
on:
  push:
    branches: [main]
    paths: ['src/**', 'assets/**', 'app.json', 'package.json', 'package-lock.json', 'scripts/privacy-html.mjs', '.github/workflows/web.yml']
  pull_request:
    paths: ['src/**', 'assets/**', 'app.json', 'package.json', 'package-lock.json', 'scripts/privacy-html.mjs', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_CLIENT_ID: c3c6b1cc-16d8-4144-a2b9-71533348d631
  AZURE_TENANT_ID: c8f2e123-9b86-471f-b7e8-e8871582d4e4
  AZURE_SUBSCRIPTION_ID: 4b37c323-30b2-4684-88ff-ba5cdc3467f9
  WEB_STORAGE_ACCOUNT: stillweb6afac7
  AZURE_RESOURCE_GROUP: still-review-rg

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write   # publishes PR screenshots to the web-test-results branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build the web app
        run: |
          npx expo export --platform web --output-dir dist-web
          node scripts/privacy-html.mjs dist-web/privacy.html
      - name: Click through the app in a real browser and take screenshots
        if: github.event_name != 'push'
        run: |
          npm i --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          (python3 -m http.server 8080 --directory dist-web >/dev/null 2>&1 &)
          sleep 2
          node scripts/web-shots.mjs http://127.0.0.1:8080 web-shots
      - name: Publish the screenshots to the web-test-results branch
        if: always() && github.event_name != 'push'
        run: |
          [ -d web-shots ] || exit 0
          cd web-shots
          git init -q && git checkout -q -b web-test-results
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          echo "Web screenshots for ${{ github.event.pull_request.head.sha || github.sha }} (run ${{ github.run_id }})" > README.md
          git add -A && git commit -qm "Web screenshots for ${{ github.event.pull_request.head.sha || github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" web-test-results
      - uses: azure/login@v2
        if: github.ref == 'refs/heads/main'
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to the static website
        if: github.ref == 'refs/heads/main'
        run: |
          # Prefer data-plane sign-in; fall back to the account key if this identity can read it.
          AUTH=(--auth-mode login)
          if ! az storage container show --account-name "$WEB_STORAGE_ACCOUNT" -n '$web' "${AUTH[@]}" -o none 2>/dev/null; then
            KEY=$(az storage account keys list -g "$AZURE_RESOURCE_GROUP" -n "$WEB_STORAGE_ACCOUNT" --query '[0].value' -o tsv)
            AUTH=(--account-key "$KEY")
          fi
          az storage blob upload-batch --account-name "$WEB_STORAGE_ACCOUNT" -d '$web' -s dist-web --overwrite --only-show-errors -o none "${AUTH[@]}"
          for route in tune journal; do
            az storage blob upload --account-name "$WEB_STORAGE_ACCOUNT" -c '$web' -n "$route" -f dist-web/index.html --content-type text/html --overwrite --only-show-errors -o none "${AUTH[@]}"
          done
      - name: Check the live site
        if: github.ref == 'refs/heads/main'
        run: |
          # Fetch, from the live site, the exact script file of this build that holds the setup screen.
          URL="https://$WEB_STORAGE_ACCOUNT.z20.web.core.windows.net"
          FILE=$(grep -rl "Make my sound" dist-web/_expo | head -1)
          [ -n "$FILE" ] || { echo "The build does not contain the new setup"; exit 1; }
          PATH_ON_SITE="${FILE#dist-web}"
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$URL$PATH_ON_SITE" | grep -q "Make my sound"; then echo "Live: $URL ($PATH_ON_SITE)"; exit 0; fi
            echo "attempt $i: $PATH_ON_SITE not live yet"; sleep 15
          done
          exit 1
