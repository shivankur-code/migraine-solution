# First-run setup (one question, a texture, one dial), then the quiet room: play and stop (sound must start within 3 s), check-in, auto-dim and brighten, dark screen.
appId: com.stillsoundlab.still
name: Quiet room
---
- launchApp:
    clearState: true
# 0. First-run setup: about 30 seconds, three taps and a dial.
- extendedWaitUntil:
    visible: "Make my sound"
    timeout: 20000
- takeScreenshot: 00a-welcome
- tapOn: "Make my sound"
- extendedWaitUntil:
    visible: "What's hardest on your ears?"
    timeout: 6000
- assertVisible: "Not sure"
- takeScreenshot: 00b-question
- tapOn: "Hiss and high sounds"
- extendedWaitUntil:
    visible: "Pick what feels restful"
    timeout: 6000
- tapOn: "Rain"
- takeScreenshot: 00c-texture
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Turn it to taste"
    timeout: 6000
- tapOn: "Tone up"
- takeScreenshot: 00d-dial
- tapOn: "Save my sound"
- extendedWaitUntil:
    visible: "Rest here."
    timeout: 20000
# The room renders behind setup, so also check that setup really closed.
- assertNotVisible: "Turn it to taste"
- takeScreenshot: 01-quiet-room
# Give the background renderer a few seconds to prepare the sound, as a person would while reading.
- extendedWaitUntil:
    visible: "this text never appears"
    timeout: 4000
    optional: true

# 1. Play, then stop well before the screen dims (sessions under 3 s are not recorded).
# The room never stops moving (the lamp breathes, the grains drift), so the test's usual wait for a
# still screen runs to its limit before every tap. That delay could outlast the 15 s auto-dim and
# land the tap on the dim veil, which only wakes the screen. Taps here wait at most half a second.
- tapOn:
    text: "Play my sound"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Fade to silence"
    timeout: 12000
- takeScreenshot: 02-playing
- extendedWaitUntil:
    visible: "this text never appears"
    timeout: 4000
    optional: true
# Safety net: if the 15 s auto-dim is already up, wake it first (while dimmed, a touch only wakes).
- runFlow:
    when:
      visible: "Screen dimmed. Tap to brighten."
    commands:
      - tapOn:
          text: "Screen dimmed. Tap to brighten."
          waitToSettleTimeoutMs: 500
      - extendedWaitUntil:
          notVisible: "Screen dimmed. Tap to brighten."
          timeout: 8000
- tapOn:
    text: "Fade to silence"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Optional: how did that go?"
    timeout: 10000
- takeScreenshot: 03-check-in
- tapOn:
    text: "A bit easier"
    waitToSettleTimeoutMs: 500
- assertVisible: "Noted. Rest well."

# 2. Auto-dim: 15 s after play the screen dims; one tap brings it back without stopping the sound.
- tapOn:
    text: "Play my sound"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Screen dimmed. Tap to brighten."
    timeout: 30000
- takeScreenshot: 04-auto-dimmed
- tapOn:
    text: "Screen dimmed. Tap to brighten."
    waitToSettleTimeoutMs: 500
# The veil takes 700 ms to lift and swallows touches until the app has let go of it. A tap that
# arrives first only "wakes" again and the sound keeps playing, so wait for the veil to be gone.
- extendedWaitUntil:
    notVisible: "Screen dimmed. Tap to brighten."
    timeout: 8000
- assertVisible: "This is making it worse"
- tapOn:
    text: "Fade to silence"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "Optional: how did that go?"
    timeout: 10000
- tapOn:
    text: "Skip"
    waitToSettleTimeoutMs: 500

# 3. Dark screen: pure black; one tap comes back.
- tapOn:
    text: "Dark screen"
    waitToSettleTimeoutMs: 500
- takeScreenshot: 05-dark-screen
- tapOn:
    text: "Dark screen. Tap to come back."
    waitToSettleTimeoutMs: 500
- assertVisible: "Rest here."
