# First-run setup (one question, a texture, one dial), then the quiet room: play and stop (sound must start within 3 s), check-in, auto-dim and brighten, dark screen.
appId: com.stillsoundlab.still
name: Quiet room
---
- launchApp:
    clearState: true
# 0. First-run setup: about 30 seconds, three taps and a dial.
- extendedWaitUntil:
    visible: "Make my sound"
    timeout: 20000
- takeScreenshot: 00a-welcome
- tapOn: "Make my sound"
- extendedWaitUntil:
    visible: "What's hardest on your ears?"
    timeout: 6000
- assertVisible: "Not sure"
- takeScreenshot: 00b-question
- tapOn: "Hiss and high sounds"
- extendedWaitUntil:
    visible: "Pick what feels restful"
    timeout: 6000
- tapOn: "Rain"
- takeScreenshot: 00c-texture
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Turn it to taste"
    timeout: 6000
- tapOn: "Tone up"
- takeScreenshot: 00d-dial
- tapOn: "Save my sound"
- extendedWaitUntil:
    visible: "Rest here."
    timeout: 20000
# The room renders behind setup, so also check that setup really closed.
- assertNotVisible: "Turn it to taste"
- takeScreenshot: 01-quiet-room
# Give the background renderer a few seconds to prepare the sound, as a person would while reading.
- extendedWaitUntil:
    visible: "this text never appears"
    timeout: 4000
    optional: true

# 1. Play, then stop well before the screen dims (sessions under 3 s are not recorded).
- tapOn: "Play my sound"
- extendedWaitUntil:
    visible: "Fade to silence"
    timeout: 12000
- takeScreenshot: 02-playing
- extendedWaitUntil:
    visible: "this text never appears"
    timeout: 4000
    optional: true
- tapOn: "Fade to silence"
- extendedWaitUntil:
    visible: "Optional: how did that go?"
    timeout: 6000
- takeScreenshot: 03-check-in
- tapOn: "A bit easier"
- assertVisible: "Noted. Rest well."

# 2. Auto-dim: 15 s after play the screen dims; one tap brings it back without stopping the sound.
- tapOn: "Play my sound"
- extendedWaitUntil:
    visible: "Screen dimmed. Tap to brighten."
    timeout: 30000
- takeScreenshot: 04-auto-dimmed
- tapOn: "Screen dimmed. Tap to brighten."
- assertVisible: "This is making it worse"
- tapOn: "Fade to silence"
- extendedWaitUntil:
    visible: "Optional: how did that go?"
    timeout: 6000
- tapOn: "Skip"

# 3. Dark screen: pure black; one tap comes back.
- tapOn: "Dark screen"
- takeScreenshot: 05-dark-screen
- tapOn: "Dark screen. Tap to come back."
- assertVisible: "Rest here."
