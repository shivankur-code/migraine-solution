# My sound: pick a texture, then "Let Still choose by ear" plays a pair and accepts a choice.
appId: com.stillsoundlab.still
name: Build my sound
---
- launchApp
- tapOn:
    id: "tab-sound"
- extendedWaitUntil:
    visible: "Your sound"
    timeout: 10000
- takeScreenshot: 06-my-sound
- scrollUntilVisible:
    element: "Ocean"
    direction: DOWN
    centerElement: true
- tapOn: "Ocean"
- takeScreenshot: 07-mixer
- scrollUntilVisible:
    element: "Let Still choose by ear"
    direction: DOWN
    centerElement: true
- tapOn: "Let Still choose by ear"
- scrollUntilVisible:
    element: "Play A then B"
    direction: DOWN
    centerElement: true
- takeScreenshot: 08-tune-by-ear
- tapOn: "Play A then B"
# The play button reads "Playing…" while A and B play, then "Play again".
- extendedWaitUntil:
    visible: "Playing…"
    timeout: 8000
- extendedWaitUntil:
    visible: "Play again"
    timeout: 40000
- tapOn: "A felt calmer"
- scrollUntilVisible:
    element: "Noted. Play the next pair when you are ready."
    direction: DOWN
    centerElement: true
- takeScreenshot: 09-after-choice
